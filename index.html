<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kas Keluarga</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#050816;--p:#0d1633;--l:#1d2d63;--t:#e6f1ff;--m:#8fa3d1;--c:#00e5ff;--g:#b967ff;--ok:#2cff9a;--bad:#ff3d71;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#2a1480 0,transparent 60%),radial-gradient(700px 400px at 0 100%,#003a52 0,transparent 60%),var(--bg);color:var(--t);font:16px Rajdhani,system-ui,sans-serif;min-height:100vh}
.w{max-width:980px;margin:0 auto;padding:14px}
h1,h2,.o{font-family:Orbitron,system-ui,sans-serif;letter-spacing:.06em}
h1{font-size:19px;margin:0;color:var(--c);text-shadow:0 0 14px var(--c)}
h2{font-size:14px;margin:0 0 10px;color:var(--g)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
#clk{color:var(--m);font-size:13px}
.live{font-size:12px;color:var(--m)}.live.on{color:var(--ok);text-shadow:0 0 8px var(--ok)}
input,select,button{font:inherit;color:var(--t);background:#081028;border:1px solid var(--l);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--c);box-shadow:0 0 8px #00e5ff55}
button{cursor:pointer;background:linear-gradient(90deg,#00b8d4,#7c3aed);border:0;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{background:var(--p);border:1px solid var(--l);white-space:nowrap;color:var(--m)}
.tabs button.a{color:#001018;background:var(--c);box-shadow:0 0 14px #00e5ff88;border-color:var(--c)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.cd{background:linear-gradient(160deg,#0f1b45cc,#0a1230cc);border:1px solid var(--l);border-radius:14px;padding:14px;box-shadow:0 0 18px #00e5ff14 inset}
.cd .k{color:var(--m);font-size:13px}.cd .v{font:700 20px Orbitron,sans-serif;margin-top:4px}
.in{color:var(--ok)}.out{color:var(--bad)}.cy{color:var(--c)}
.cv{position:relative;height:250px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{color:var(--m);font-weight:600;text-align:left;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid #16224d}
td input{width:100%;padding:5px 7px}
.r{text-align:right}
.bar{height:7px;border-radius:9px;background:#0a1230;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--g))}
.bar i.x{background:var(--bad)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.x1{background:none;color:var(--bad);padding:2px 8px;border:1px solid var(--bad)}
.n{color:var(--m);font-size:13px;margin:8px 0}
</style></head><body><div class="w">
<header><div><h1>◈ KAS KELUARGA</h1><div id="clk"></div></div>
<div><span id="lv" class="live">● MODE LOKAL</span> <input type="month" id="mon"></div></header>
<div id="app"></div></div>
<script>
const C=["Kontrakan","Makan","Wisuda","Bensin & Servis Motor","Beras, Minyak, Gas, Telur","Listrik","Air & Sampah","Kesehatan","Sedekah","Keperluan Lain-lain","Dana Darurat","Nabung"];
const B0=[1500000,1500000,300000,300000,600000,200000,100000,200000,150000,300000,300000,550000];
const I=["Gaji","Bonus","Usaha","Lainnya"],T=["Ringkasan","Pemasukan","Pengeluaran","Makan","Anggaran"];
const COL=["#00e5ff","#b967ff","#2cff9a","#ff3d71","#ffd166","#4d7cff","#ff8c42","#7cf5ff","#ff6bd6","#9dff6b","#c0a3ff","#ffa3b5"];
const rp=n=>"Rp "+Math.round(n).toLocaleString("id-ID");
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S,doc,mon=today().slice(0,7),tab="Ringkasan",fcat="Semua",ch=[];
const def=()=>({gaji:6000000,b:Object.fromEntries(C.map((c,i)=>[c,B0[i]])),
tx:[{id:1,d:mon+"-01",t:"in",c:"Gaji",n:"Gaji bulanan",a:6000000}],
p:[["Beras premium","kg",15500],["Minyak goreng","liter",18000],["Telur ayam","kg",29000],["Gula pasir","kg",18000],["Bawang merah","kg",38000],["Bawang putih","kg",38000],["Cabai rawit merah","kg",55000],["Daging ayam","kg",38000],["Tempe","papan",6000]].map(x=>({n:x[0],u:x[1],p:x[2],d:""}))});
const bud=c=>c==="Sedekah"?S.gaji*.025:S.b[c];
async function save(){try{if(doc)await doc.set(S);else localStorage.setItem("kk",JSON.stringify(S))}catch(e){}}
const mt=()=>S.tx.filter(x=>x.d.startsWith(mon));
const sum=(a,t,c)=>a.filter(x=>x.t==t&&(!c||x.c==c)).reduce((s,x)=>s+x.a,0);
function rows(l){return `<div class=sc><table><tr><th>Tanggal<th>Kategori<th>Catatan<th class=r>Jumlah<th></tr>`+
l.sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).map(x=>`<tr><td>${x.d.slice(5)}<td>${esc(x.c)}<td>${esc(x.n)}<td class="r ${x.t}">${x.t=="in"?"+":"-"}${rp(x.a)}<td class=r><button class=x1 onclick="del(${x.id})">×</button></tr>`).join("")+(l.length?"":`<tr><td colspan=5 class=n>Belum ada data bulan ini.</tr>`)+`</table></div>`}
const form=(t,fc)=>`<div class=f><input type=date id=fd value="${today()}"><select id=fc ${fc?"disabled":""}>${(t=="in"?I:C).map(c=>`<option ${c==fc?"selected":""}>${esc(c)}</option>`).join("")}</select><input id=fn placeholder="Catatan"><input id=fa type=number inputmode=numeric placeholder="Jumlah (Rp)"><button onclick="add('${t}')">+ Tambah</button></div>`;
function add(t){const a=+document.getElementById("fa").value;if(!a||a<=0)return;
S.tx.push({id:Date.now(),d:document.getElementById("fd").value||today(),t,c:document.getElementById("fc").value,n:document.getElementById("fn").value,a});save();render(1)}
function del(id){S.tx=S.tx.filter(x=>x.id!=id);save();render(1)}
function setG(v){S.gaji=+v||0;save();render(1)}
function setB(i,v){S.b[C[i]]=+v||0;save();render(1)}
function setP(i,v){S.p[i].p=+v||0;S.p[i].d=today();save();render(1)}
function addP(){const n=document.getElementById("pn").value.trim(),p=+document.getElementById("pp").value;if(!n||!p)return;S.p.push({n,u:document.getElementById("pu").value||"kg",p,d:today()});save();render(1)}
function delP(i){S.p.splice(i,1);save();render(1)}
function view(){const tx=mt(),inc=sum(tx,"in"),out=sum(tx,"out"),sisa=inc-out;
const cards=`<div class=g><div class=cd><div class=k>PEMASUKAN</div><div class="v in">${rp(inc)}</div></div><div class=cd><div class=k>PENGELUARAN</div><div class="v out">${rp(out)}</div></div><div class=cd><div class=k>SISA SALDO</div><div class="v ${sisa<0?"out":"cy"}">${rp(sisa)}</div></div></div>`;
if(tab=="Ringkasan"){return cards+`<div class=g><div class=cd><h2>PORSI PENGELUARAN</h2><div class=cv><canvas id=c1></canvas></div></div><div class=cd><h2>ANGGARAN VS REALISASI</h2><div class=cv><canvas id=c2></canvas></div></div></div>
<div class=cd><h2>STATUS ANGGARAN</h2><div class=sc><table><tr><th>Kategori<th class=r>Anggaran<th class=r>Terpakai<th class=r>Sisa<th>%</tr>`+C.map(c=>{const b=bud(c),s=sum(tx,"out",c),p=b?s/b*100:0;return `<tr><td>${esc(c)}<td class=r>${rp(b)}<td class=r>${rp(s)}<td class="r ${b-s<0?"out":"in"}">${rp(b-s)}<td><div class=bar><i class="${p>100?"x":""}" style="width:${Math.min(p,100)}%"></i></div></tr>`}).join("")+`</table></div></div>`}
if(tab=="Pemasukan")return cards+`<div class=cd><h2>CATAT PEMASUKAN</h2>${form("in")}${rows(tx.filter(x=>x.t=="in"))}</div>`;
if(tab=="Pengeluaran"){const fl=["Semua",...C];return cards+`<div class=cd><h2>CATAT PENGELUARAN</h2>${form("out")}<select onchange="fcat=this.value;render(1)" style="margin-bottom:10px">${fl.map(c=>`<option ${c==fcat?"selected":""}>${esc(c)}</option>`).join("")}</select>${rows(tx.filter(x=>x.t=="out"&&(fcat=="Semua"||x.c==fcat)))}</div>`}
if(tab=="Makan"){const b=bud("Makan"),s=sum(tx,"out","Makan");return `<div class=g><div class=cd><div class=k>ANGGARAN MAKAN</div><div class="v cy">${rp(b)}</div></div><div class=cd><div class=k>TERPAKAI</div><div class="v out">${rp(s)}</div></div><div class=cd><div class=k>SISA</div><div class="v ${b-s<0?"out":"in"}">${rp(b-s)}</div></div></div>
<div class=cd style="margin-bottom:12px"><h2>HARGA BAHAN POKOK</h2><div class=n>Harga awal hanya perkiraan dan belum terhubung ke data harga live. Ubah sesuai harga pasar terbaru, tanggalnya otomatis tercatat.</div><div class=sc><table><tr><th>Bahan<th>Satuan<th class=r>Harga (Rp)<th>Diperbarui<th></tr>`+S.p.map((x,i)=>`<tr><td>${esc(x.n)}<td>${esc(x.u)}<td><input type=number value="${x.p}" onchange="setP(${i},this.value)"><td>${x.d||"perkiraan"}<td><button class=x1 onclick="delP(${i})">×</button></tr>`).join("")+`</table></div>
<div class=f style="margin-top:10px"><input id=pn placeholder="Bahan baru"><input id=pu placeholder="Satuan"><input id=pp type=number placeholder="Harga"><button onclick="addP()">+ Harga</button></div></div>
<div class=cd><h2>CATAT MAKAN</h2>${form("out","Makan")}${rows(tx.filter(x=>x.t=="out"&&x.c=="Makan"))}</div>`}
const al=C.reduce((s,c)=>s+bud(c),0);
return `<div class=cd><h2>PENGATURAN</h2><div class=n>Gaji bulanan (dasar sedekah 2,5%)</div><input type=number value="${S.gaji}" onchange="setG(this.value)"><div class=n>Sedekah otomatis: ${rp(S.gaji*.025)}</div><div class=sc><table><tr><th>Kategori<th>Anggaran / bulan</tr>`+C.map((c,i)=>`<tr><td>${esc(c)}<td>${c=="Sedekah"?rp(bud(c))+" (otomatis)":`<input type=number value="${S.b[c]}" onchange="setB(${i},this.value)">`}</tr>`).join("")+`</table></div><div class=n>Total teralokasi ${rp(al)} dari gaji ${rp(S.gaji)} — ${S.gaji-al>=0?"belum teralokasi "+rp(S.gaji-al):"melebihi gaji "+rp(al-S.gaji)}</div></div>`}
function render(f){if(!S)return;const a=document.activeElement;if(!f&&a&&/INPUT|SELECT/.test(a.tagName)&&a.id!="mon")return;
document.getElementById("app").innerHTML=`<div class=tabs>${T.map(t=>`<button class="${t==tab?"a":""}" onclick="tab='${t}';render(1)">${t}</button>`).join("")}</div>`+view();
ch.forEach(c=>c.destroy());ch=[];if(tab!="Ringkasan"||!window.Chart)return;
const tx=mt(),sp=C.map(c=>sum(tx,"out",c));Chart.defaults.color="#8fa3d1";
ch.push(new Chart(c1,{type:"doughnut",data:{labels:C,datasets:[{data:sp,backgroundColor:COL,borderColor:"#050816"}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}}));
ch.push(new Chart(c2,{type:"bar",data:{labels:C.map((c,i)=>i+1),datasets:[{label:"Anggaran",data:C.map(bud),backgroundColor:"#b967ff"},{label:"Terpakai",data:sp,backgroundColor:"#00e5ff"}]},options:{maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>v/1000+"rb"},grid:{color:"#16224d"}},x:{grid:{display:false}}}}}));}
const mi=document.getElementById("mon");mi.value=mon;mi.onchange=()=>{mon=mi.value||mon;render(1)};
setInterval(()=>{document.getElementById("clk").textContent=new Date().toLocaleString("id-ID",{dateStyle:"full",timeStyle:"medium"})},1000);
try{S=JSON.parse(localStorage.getItem("kk"))}catch(e){}S=S||def();render(1);
(async()=>{try{const d=window.claude&&await claude.use("db");if(!d)return;doc=d.doc("app/state");
doc.onSnapshot(s=>{if(s.exists){S=JSON.parse(JSON.stringify(s.data()))}else{doc.set(S).catch(()=>{})}
const l=document.getElementById("lv");l.textContent="● LIVE";l.className="live on";render()},()=>{doc=null})}catch(e){}})();
</script></body></html>
